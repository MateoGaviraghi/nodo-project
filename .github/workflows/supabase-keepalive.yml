name: Supabase Keepalive

# Mantiene la DB de Supabase (free tier) activa pegándole una query trivial
# cada 3 dias. Supabase pausa proyectos free tras ~7 dias sin actividad de DB.
#
# Configuracion requerida (GitHub: Settings -> Secrets and variables -> Actions):
#   - SUPABASE_URL        -> https://<project-ref>.supabase.co
#   - SUPABASE_ANON_KEY   -> anon/public key (NO service_role)
#
# Requiere tabla publica `_keepalive` con policy SELECT para rol anon.

on:
  schedule:
    # Cada 3 dias a las 09:00 UTC (margen amplio vs limite de ~7 dias)
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required secrets SUPABASE_URL or SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Ping _keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          ENDPOINT="${SUPABASE_URL}/rest/v1/_keepalive?select=id&limit=1"

          # -s silent, -S show errors, write status + short body for debug.
          # NUNCA logueamos las keys (van solo como headers via env).
          HTTP_CODE=$(curl \
            -sS \
            -o /tmp/response.txt \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${ENDPOINT}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response (first 500 chars):"
          head -c 500 /tmp/response.txt || true
          echo ""

          # Fallar el workflow si no es 2xx -> GitHub te manda email automatico
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Supabase ping failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Keepalive ping OK"
